<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Favicon: the badge alone, no wordmark. The dark plate keeps it legible
       on light and dark browser chrome alike. Geometry matches Logo.tsx (v4)
       exactly — favicon.ico and apple-icon.png are exported from this file,
       so re-export both if it changes. -->
