<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Favicon: the wheel alone, no wordmark. The dark plate keeps the
       off-white tire legible on light and dark browser chrome alike.
       Drawn without the inner rim ring, which closes up below ~28px. -->
  <rect width="100" height="100" fill="#0b0c0b"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#f2f3f1" stroke-width="11"/>
  <g fill="#7cc576" transform="translate(50 50) scale(0.62) translate(-50 -50)">
    <circle cx="38" cy="32" r="18"/>
    <circle cx="62" cy="32" r="18"/>
    <circle cx="38" cy="56" r="18"/>
    <circle cx="62" cy="56" r="18"/>
    <rect x="46" y="62" width="8" height="32" rx="4" transform="rotate(7 50 62)"/>
  </g>
</svg>
